<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1のことば、あいうえお</title>
<meta name="description" content="F1中継で聞こえてくる言葉を、五十音順にひとつずつ。最新は第3回「う」ウイング。">
<link rel="canonical" href="https://kiyo138.github.io/f1-kotoba/">
<meta property="og:title" content="F1のことば、あいうえお">
<meta property="og:description" content="F1中継で聞こえてくる言葉を、五十音順にひとつずつ。最新は第3回「う」ウイング。">
<meta property="og:image" content="https://kiyo138.github.io/f1-kotoba/03/f1-03-hero.png">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="900">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kiyo138.github.io/f1-kotoba/">
<meta property="og:site_name" content="F1のことば、あいうえお">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<style>
/* --- 1. カラートークン ------------------------------------ */
:root{
  color-scheme: light dark;

  --bg:          #F6F5F2;  /* 連載の地色。図版PNGの地と同一 */
  --ink:         #191B1F;  /* 本文 */
  --sub:         #5A5D64;  /* 補助文字。地色に対し 6.05:1 */
  --accent:      #D4342A;  /* 強調。罫・マーク・大きな文字専用（地色に対し 4.46:1） */
  --accent-text: #B32A21;  /* 小さい文字用に暗くした強調色（5.89:1）*/

  /* 基調4色から起こした中間色 */
  --rule:        #DDDAD3;  /* 細罫・画像の縁 */
  --rule-strong: #C6C2B9;  /* 押せる要素の縁 */
  --panel:       #EDEBE5;  /* 箇条書きなどの面 */
  --card:        #FCFBF9;  /* カード・ボタンの面 */
  --plate-rim:   #DDDAD3;  /* 画像の縁（暗色時に差し替える） */
  --img-filter:  none;

  /* 寸法 */
  --measure: 41.5rem;      /* 本文1行の最大幅 = 664px */
  --wide:    57.5rem;      /* 図版の最大幅   = 920px */
  --pad:     1rem;         /* 画面左右の余白（狭い画面） */
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:          #15171A;
    --ink:         #E9E7E2;
    --sub:         #A8ABB1;  /* 8.0:1 */
    --accent:      #F2564A;  /* 5.3:1 …暗色時は小さい文字にも使える */
    --accent-text: #F2564A;
    --rule:        #2E3238;
    --rule-strong: #3D424A;
    --panel:       #1D2126;
    --card:        #1B1E23;
    --plate-rim:   #4A5058;  /* 明るい図版を暗い地から縁取る */
    --img-filter:  brightness(.90);
  }
}

/* --- 2. 下地 ---------------------------------------------- */
*, *::before, *::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  /* OS標準のみ。Latinはsystem-ui、和文は各OSの標準ゴシックに落ちる */
  font-family:
    system-ui, -apple-system,
    "Hiragino Sans", "Hiragino Kaku Gothic ProN",
    "Noto Sans JP",
    "Yu Gothic Medium", "游ゴシック Medium", "Yu Gothic", YuGothic,
    "Meiryo", sans-serif;
  font-size:1.0625rem;      /* 17px */
  line-height:1.9;
  letter-spacing:.03em;
  line-break:strict;        /* 和文の禁則を厳密に */
  text-rendering:optimizeLegibility;
}
@media (min-width:600px){
  body{ font-size:1.125rem; }   /* 18px */
  :root{ --pad:1.5rem; }
}
img{ max-width:100%; height:auto; display:block; }
a{ color:inherit; }
a:focus-visible, summary:focus-visible{
  outline:3px solid var(--ink);
  outline-offset:3px;
  border-radius:4px;
}
.skip{
  position:absolute; left:-9999px; top:0;
  background:var(--card); color:var(--ink);
  padding:12px 16px; border:2px solid var(--ink); z-index:10;
}
.skip:focus{ left:8px; top:8px; }

/* --- 3. 桁組み -------------------------------------------- */
.wrap{ max-width:var(--wide); margin-inline:auto; padding-inline:var(--pad); }
.col { max-width:var(--measure); margin-inline:auto; }
.prose > *      { max-width:var(--measure); margin-inline:auto; }
.prose > figure { max-width:var(--wide); }

/* --- 4. ヘッダ／フッタ ------------------------------------ */
.topbar{ border-bottom:1px solid var(--rule); background:var(--bg); }
.topbar-inner{ max-width:var(--measure); margin-inline:auto; padding-inline:var(--pad); }
.series{
  display:inline-block;
  padding:14px 0;
  font-size:.9375rem;          /* 15px */
  letter-spacing:.16em;
  color:var(--sub);
  text-decoration:none;
  min-height:44px;             /* 押せる高さを確保 */
}
.series:hover{ color:var(--ink); }

.site-footer{
  margin:56px auto 40px;
  padding-top:20px;
  border-top:1px solid var(--rule);
  font-size:.9375rem;
  letter-spacing:.14em;
  color:var(--sub);
}

/* --- 5. 記事タイトル -------------------------------------- */
.title-block{ margin:36px auto 24px; }
.eyebrow{
  margin:0 0 10px;
  font-size:.9375rem;          /* 15px */
  letter-spacing:.14em;
  color:var(--sub);
  line-height:1.4;
}
.title{
  margin:0;
  display:flex; align-items:center; gap:.5rem;
  font-size:1.875rem;          /* 30px */
  line-height:1.3;
  font-weight:700;
  letter-spacing:.04em;
  font-feature-settings:"palt" 1;   /* 見出しの約物アキを詰める */
}
@media (min-width:600px){
  .title{ font-size:2.375rem; gap:.625rem; }   /* 38px */
}

/* かなタイル ── 五十音順という連載の背骨を、記事・索引で同じ形に */
.tile{
  flex:none;
  display:inline-flex; align-items:center; justify-content:center;
  width:1.75em; height:1.75em;
  border:2px solid var(--accent);
  border-radius:7px;
  color:var(--accent);
  font-weight:700;
  letter-spacing:0;
  line-height:1;
  font-feature-settings:normal;
}

/* --- 6. 本文 ---------------------------------------------- */
.prose{ margin-top:8px; }
.prose p{ margin:0 0 1.55em; }
.prose p:last-child{ margin-bottom:0; }

.lede{
  color:var(--sub);
  font-size:1.0625em;
  margin-bottom:2em !important;
}

.prose h2{
  margin:48px 0 18px;
  font-size:1.3125rem;         /* 21px */
  line-height:1.55;
  font-weight:700;
  letter-spacing:.03em;
  font-feature-settings:"palt" 1;
}
.prose h2::after{             /* 図版PNGの「見出し＋赤い下線」に揃える */
  content:"";
  display:block;
  width:72px; height:3px;
  margin-top:10px;
  background:var(--accent);
}
@media (min-width:600px){
  .prose h2{ font-size:1.4375rem; margin-top:64px; }  /* 23px */
}

/* 箇条書き ── 本文の流れから拾い読みできるよう、面で区切る */
.prose ul{
  list-style:none;
  margin:0 0 1.8em;
  padding:18px 20px 18px 22px;
  background:var(--panel);
  border-radius:8px;
}
.prose li{
  position:relative;
  padding-left:1.15em;
  margin:0 0 .55em;
  line-height:1.8;
}
.prose li:last-child{ margin-bottom:0; }
.prose li::before{            /* 原稿の「・」に相当する印 */
  content:"";
  position:absolute;
  left:0; top:.72em;
  width:7px; height:7px;
  border-radius:50%;
  background:var(--accent);
}

/* --- 7. 図版 ---------------------------------------------- */
.fig{ margin:36px auto; }
@media (min-width:600px){ .fig{ margin:44px auto; } }

.plate{                       /* 画像を包む枠。地色が図版の地と同じなので細罫だけで足りる */
  display:block;
  border:1px solid var(--plate-rim);
  border-radius:10px;
  overflow:hidden;
  background:#F6F5F2;
  filter:var(--img-filter);
}
a.plate{ text-decoration:none; }
a.plate:hover{ border-color:var(--rule-strong); }
.fig-hero{ margin-top:8px; }

/* 図の説明文＋拡大の案内。
   図が読めない画面のための代替本文なので、本文より一段弱く、かつ図にぶら下げて見せる。
   縦罫は画像の縁 --plate-rim と同色。画像の枠が下へ続いているように見せるため。 */
figcaption{
  margin-top:12px;
  max-width:34rem;                /* 544px。広い画面で1行32字前後に抑える */
  padding-inline-start:12px;
  border-inline-start:2px solid var(--plate-rim);
  font-size:1rem;                 /* 16px。本文は17/18pxなので必ず一段小さい */
  line-height:1.75;               /* 本文1.9より詰める。図の一部としてひと塊に見せる */
  color:var(--sub);               /* #5A5D64 / 暗色時 #A8ABB1 */
  text-align:start;
  text-wrap:balance;              /* 折り返した行の長さを揃える。非対応環境では無視される */
}
@media (min-width:600px){
  figcaption{ margin-top:16px; }
}

/* 案内文はキャプションと同じ段落の中に続けて置く（別行に立てない） */
.cap-hint{
  margin-inline-start:.5em;       /* キャプション文との間 8px */
  font-size:.9375rem;             /* 15px */
}
.cap-hint::before{ content:"⤢ "; }
.cap-hint:only-child{ margin-inline-start:0; }   /* キャプション未記入の回 */

/* --- 8. 次回予告（控えめに） ------------------------------ */
.next-up{
  margin:48px auto 0;
  padding-top:20px;
  border-top:1px solid var(--rule);
  color:var(--sub);
  font-size:1rem;
  line-height:1.85;
}
.next-up .label{
  display:block;
  margin-bottom:2px;
  font-size:.875rem;
  letter-spacing:.18em;
  color:var(--accent-text);
  font-weight:700;
}

/* --- 9. 記事末ナビ ---------------------------------------- */
.pager{ margin:40px auto 0; }
.pager-index{
  display:flex; align-items:center; justify-content:center;
  min-height:56px;
  padding:12px 16px;
  border:1px solid var(--rule-strong);
  border-radius:8px;
  background:var(--card);
  text-decoration:none;
  font-weight:700;
  letter-spacing:.06em;
}
.pager-index:hover{ background:var(--panel); }

.pager-sides{
  display:grid; gap:12px;
  grid-template-columns:1fr;
  margin-top:12px;
}
@media (min-width:600px){
  .pager-sides{ grid-template-columns:1fr 1fr; gap:16px; }
}

.pager-link, .pager-empty{
  margin:0;
  min-height:76px;
  padding:14px 16px;
  border-radius:8px;
  display:flex; flex-direction:column; justify-content:center; gap:6px;
}
.pager-link{                          /* 行ける側：面と枠を強く、矢印つき */
  border:1px solid var(--rule-strong);
  background:var(--card);
  text-decoration:none;
  color:var(--ink);
}
.pager-link:hover{ background:var(--panel); }
.pager-empty{                         /* 欠けている側：面なし・枠は細罫・押せない見た目 */
  border:1px dashed var(--rule);
  background:transparent;
  color:var(--sub);
}
.pager-dir{
  font-size:.9375rem;
  letter-spacing:.1em;
  color:var(--sub);
  line-height:1.4;
}
.pager-link .pager-dir{ color:var(--accent-text); font-weight:700; }
.pager-title{
  display:flex; align-items:center; gap:.45rem;
  font-size:1.0625rem; font-weight:700; line-height:1.4;
}
.pager-msg{ font-size:1rem; line-height:1.6; }
.tile-sm{
  font-size:.9375rem;
  width:1.9em; height:1.9em;
  border-width:1.5px; border-radius:5px;
}
.next .pager-dir{ text-align:right; }
.next .pager-title{ justify-content:flex-end; }
.pager-empty.next{ align-items:flex-end; text-align:right; }
@media (max-width:599px){             /* 狭い画面では左揃えに戻す（行頭が揃うほうが読みやすい） */
  .next .pager-dir, .pager-empty.next{ text-align:left; }
  .next .pager-title{ justify-content:flex-start; }
  .pager-empty.next{ align-items:flex-start; }
}

/* ============================================================
   ここから索引ページ固有
   ============================================================ */
:root{ --badge-fg:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root{ --badge-fg:#15171A; } }

/* 索引の見出し
   ── 文字は本文桁（664px）に揃える。カード格子だけが920pxへ広がる。
      記事ページで「文字は664、図版は920」としているのと同じ関係。 */
.index-head{ margin:36px auto 8px; }
.index-title{
  margin:0 0 12px;
  font-size:1.625rem;          /* 26px */
  line-height:1.4;
  font-weight:700;
  letter-spacing:.05em;
  font-feature-settings:"palt" 1;
}
.index-title::after{
  content:"";
  display:block;
  width:72px; height:3px;
  margin-top:12px;
  background:var(--accent);
}
.index-lead{
  margin:0;
  color:var(--sub);
  font-size:1rem;
  line-height:1.85;
}
@media (min-width:600px){ .index-title{ font-size:2rem; } }

/* 行（あ行・か行…）の見出し ── 20回を超えても迷子にならないための区切り */
.row-label{
  display:flex; align-items:center; gap:14px;
  margin:44px auto 18px;
  font-size:1rem;
  font-weight:700;
  letter-spacing:.2em;
  color:var(--sub);
}
.row-label::after{
  content:""; flex:1 1 auto; height:1px; background:var(--rule);
}

/* カード一覧 */
.cards{
  list-style:none;
  margin:0; padding:0;
  display:grid;
  gap:20px;
  grid-template-columns:1fr;        /* スマホは1カラム */
}
@media (min-width:600px){ .cards{ grid-template-columns:repeat(2,1fr); gap:22px; } }
@media (min-width:960px){ .cards{ grid-template-columns:repeat(3,1fr); } }

.card-link{
  display:block;
  height:100%;
  border:1px solid var(--rule);
  border-radius:12px;
  background:var(--card);
  text-decoration:none;
  color:var(--ink);
  overflow:hidden;
  transition:border-color .12s linear, background-color .12s linear;
}
.card-link:hover{ border-color:var(--rule-strong); background:var(--panel); }

.card-thumb{
  display:block;
  border-bottom:1px solid var(--rule);
  background:#F6F5F2;              /* 図版の地と同色。画像との継ぎ目が出ない */
  filter:var(--img-filter);
}
.card-thumb img{ width:100%; aspect-ratio:16/9; object-fit:cover; }

.card-body{ display:block; padding:16px 18px 20px; }

.card-no{
  display:flex; align-items:center; gap:10px;
  font-size:.9375rem;              /* 15px */
  letter-spacing:.12em;
  color:var(--sub);
  line-height:1.4;
  margin-bottom:8px;
}
.badge{
  flex:none;
  padding:3px 8px;
  border-radius:4px;
  background:var(--accent);
  color:var(--badge-fg);
  font-size:.8125rem;              /* 13px。色だけに頼らず「最新」と書く */
  font-weight:700;
  letter-spacing:.08em;
  line-height:1.5;
}
.card-title{
  display:flex; align-items:center; gap:.5rem;
  font-size:1.1875rem;             /* 19px */
  font-weight:700;
  line-height:1.35;
  letter-spacing:.02em;
}
.card-note{
  display:block;
  margin-top:10px;
  color:var(--sub);
  font-size:1rem;                  /* 16px */
  line-height:1.7;
}
.card-note::before{ content:"「"; }
.card-note::after { content:"」"; }
</style>
</head>

<body>
<a class="skip" href="#main">記事一覧へ</a>

<div class="topbar">
  <div class="topbar-inner">
    <span class="series">F1のことば、あいうえお</span>
  </div>
</div>

<div class="wrap">

  <header class="col index-head">
    <h1 class="index-title">F1のことば、あいうえお</h1>
    <p class="index-lead">
      F1中継を見ていると、聞き慣れない言葉が次々と出てきます。<br>
      毎週ひとつずつ、五十音順に紹介していきます。
    </p>
  </header>

  <main id="main">

    <h2 class="row-label">あ行</h2>

    <ul class="cards">

      <li>
        <a class="card-link" href="01/">
          <span class="card-thumb">
            <img src="01/f1-01-hero.png" width="1600" height="900" loading="lazy" alt="第1回「あ」アンダーステア のアイキャッチ画像">
          </span>
          <span class="card-body">
            <span class="card-no">第1回</span>
            <span class="card-title"><span class="tile tile-sm">あ</span>アンダーステア</span>
            <span class="card-note">曲がりたいのに、曲がってくれない</span>
          </span>
        </a>
      </li>

      <li>
        <a class="card-link" href="02/">
          <span class="card-thumb">
            <img src="02/f1-02-hero.png" width="1600" height="900" loading="lazy" alt="第2回「い」インターミディエイト のアイキャッチ画像">
          </span>
          <span class="card-body">
            <span class="card-no">第2回</span>
            <span class="card-title"><span class="tile tile-sm">い</span>インターミディエイト</span>
            <span class="card-note">雨と晴れの、あいだ</span>
          </span>
        </a>
      </li>

      <li>
        <a class="card-link" href="03/">
          <span class="card-thumb">
            <img src="03/f1-03-hero.png" width="1600" height="900" loading="lazy" alt="第3回「う」ウイング のアイキャッチ画像">
          </span>
          <span class="card-body">
            <span class="card-no">第3回<span class="badge">最新</span></span>
            <span class="card-title"><span class="tile tile-sm">う</span>ウイング</span>
            <span class="card-note">飛行機の翼を、さかさまにする</span>
          </span>
        </a>
      </li>
    </ul>

  </main>

  <footer class="col site-footer">F1のことば、あいうえお</footer>
</div>

</body>
</html>
