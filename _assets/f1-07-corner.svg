<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740" width="1600" height="740" role="img" aria-labelledby="ttl desc">
  <title id="ttl">曲がるとき、外側タイヤの接地面はどうなるか</title>
  <desc id="desc">コーナーで外側になるタイヤ1本を正面から見た比較図。左はまっすぐ立てたタイヤで、外へ押す力で外側へ倒れ、内側の端が浮いて接地面（赤い帯）がせまくなる。右は内向きに傾けたタイヤで、同じ力で倒れても路面に面が付き、接地面が広い。</desc>
  <!-- 影・filter 不使用。タイヤは架空・無地。 -->
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D4342A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="740" fill="#F6F5F2"/>
  <text x="88" y="88" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="42" font-weight="700" fill="#191B1F">曲がるとき、外側タイヤの接地面はどうなるか</text>
  <line x1="88" y1="118" x2="248" y2="118" stroke="#D4342A" stroke-width="5"/>
  <text x="88" y="158" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="400" fill="#5A5D64">コーナーで外側になるタイヤ1本を、正面から見た図です。図の右がコーナーの外側。点線は力がかかる前。</text>
  <rect x="88" y="190" width="692" height="470" rx="6" fill="#FFFFFF" stroke="#A9A6A0" stroke-width="2"/>
  <text x="112" y="230" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="28" font-weight="700" fill="#191B1F">まっすぐ立てたタイヤ</text>
  <text x="112" y="258" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="18" font-weight="400" fill="#5A5D64">外へ倒れて、内側の端が浮く</text>
  <rect x="110" y="540" width="648" height="34" fill="#CFCCC5"/>
  <line x1="110" y1="540" x2="758" y2="540" stroke="#5A5D64" stroke-width="3"/>
  <rect x="820" y="190" width="692" height="470" rx="6" fill="#FFFFFF" stroke="#A9A6A0" stroke-width="2"/>
  <text x="844" y="230" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="28" font-weight="700" fill="#191B1F">内向きに傾けたタイヤ</text>
  <text x="844" y="258" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="18" font-weight="400" fill="#5A5D64">同じ力で倒れても、面が路面に付く</text>
  <rect x="842" y="540" width="648" height="34" fill="#CFCCC5"/>
  <line x1="842" y1="540" x2="1490" y2="540" stroke="#5A5D64" stroke-width="3"/>
  <rect x="384" y="340" width="100" height="200" rx="16" fill="none" stroke="#5A5D64" stroke-width="3" stroke-dasharray="9 7" transform="rotate(0 484 540)"/>
  <g transform="rotate(9 484 540)">
    <rect x="384" y="340" width="100" height="200" rx="16" fill="#3A3B40" stroke="#191B1F" stroke-width="3"/>
    <rect x="409" y="390" width="50" height="100" rx="8" fill="#A9A6A0"/>
  </g>
  <rect x="454" y="535" width="32" height="10" fill="#D4342A"/>
  <rect x="1076" y="340" width="100" height="200" rx="16" fill="none" stroke="#5A5D64" stroke-width="3" stroke-dasharray="9 7" transform="rotate(-9 1076 540)"/>
  <g transform="rotate(0 1076 540)">
    <rect x="1076" y="340" width="100" height="200" rx="16" fill="#3A3B40" stroke="#191B1F" stroke-width="3"/>
    <rect x="1101" y="390" width="50" height="100" rx="8" fill="#A9A6A0"/>
  </g>
  <rect x="1076" y="535" width="100" height="10" fill="#D4342A"/>
  <line x1="350" y1="304" x2="480" y2="304" stroke="#D4342A" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="350" y="284" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#D4342A">外へ押す力</text>
  <line x1="1042" y1="304" x2="1172" y2="304" stroke="#D4342A" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="1042" y="284" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#D4342A">外へ押す力</text>
  <line x1="250" y1="480" x2="402.0" y2="535.0" stroke="#F6F5F2" stroke-width="7" stroke-linecap="round"/>
  <line x1="250" y1="480" x2="402.0" y2="535.0" stroke="#191B1F" stroke-width="2.5"/>
  <circle cx="402.0" cy="535.0" r="4.5" fill="#191B1F" stroke="#F6F5F2" stroke-width="1.5"/>
  <text x="112" y="478" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#191B1F">内側の端が浮く</text>
  <text x="436" y="630" text-anchor="middle" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#D4342A">接地面（赤い帯）はせまい</text>
  <line x1="452" y1="606" x2="468.0" y2="545.0" stroke="#F6F5F2" stroke-width="7" stroke-linecap="round"/>
  <line x1="452" y1="606" x2="468.0" y2="545.0" stroke="#191B1F" stroke-width="2.5"/>
  <circle cx="468.0" cy="545.0" r="4.5" fill="#191B1F" stroke="#F6F5F2" stroke-width="1.5"/>
  <text x="1126" y="630" text-anchor="middle" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#D4342A">接地面（赤い帯）は広い</text>
  <line x1="1126" y1="606" x2="1126.0" y2="545.0" stroke="#F6F5F2" stroke-width="7" stroke-linecap="round"/>
  <line x1="1126" y1="606" x2="1126.0" y2="545.0" stroke="#191B1F" stroke-width="2.5"/>
  <circle cx="1126.0" cy="545.0" r="4.5" fill="#191B1F" stroke="#F6F5F2" stroke-width="1.5"/>
  <text x="88" y="708" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="400" fill="#5A5D64">F1のことば、あいうえお ／ 第7回「き」　キャンバー</text>
  <text x="1512" y="708" text-anchor="end" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="15" font-weight="400" fill="#5A5D64">※ 架空の模式図です。傾きは大きく描いています。</text>
</svg>
