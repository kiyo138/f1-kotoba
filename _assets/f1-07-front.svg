<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740" width="1600" height="740" role="img" aria-labelledby="ttl desc">
  <title id="ttl">正面から見た、タイヤの傾き</title>
  <desc id="desc">マシンを真正面から見た簡略図。左右のタイヤが上すぼまりのハの字に傾いている。右のタイヤに、垂直の点線とタイヤの中心線のあいだの角度（キャンバー角）を赤い弧で示している。度数の数字は書いていない。</desc>
  <!-- 影は radialGradient。filter 不使用。架空・無地の簡略マシン。傾きは誇張。 -->
  <defs>
    <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="740" fill="#F6F5F2"/>
  <text x="88" y="88" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="42" font-weight="700" fill="#191B1F">正面から見た、タイヤの傾き</text>
  <line x1="88" y1="118" x2="248" y2="118" stroke="#D4342A" stroke-width="5"/>
  <text x="88" y="158" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="400" fill="#5A5D64">マシンを真正面から見た簡略図です。左右のタイヤは、上側が内向きに傾いています。</text>
  <line x1="150" y1="582" x2="890" y2="582" stroke="#8A8D93" stroke-width="4"/>
  <ellipse cx="290" cy="584" rx="70" ry="9" fill="url(#shadowGrad)"/>
  <ellipse cx="750" cy="584" rx="70" ry="9" fill="url(#shadowGrad)"/>
  <line x1="460" y1="470" x2="290" y2="482" stroke="#5A5D64" stroke-width="7" stroke-linecap="round"/>
  <line x1="460" y1="525" x2="290" y2="498" stroke="#5A5D64" stroke-width="7" stroke-linecap="round"/>
  <line x1="580" y1="470" x2="750" y2="482" stroke="#5A5D64" stroke-width="7" stroke-linecap="round"/>
  <line x1="580" y1="525" x2="750" y2="498" stroke="#5A5D64" stroke-width="7" stroke-linecap="round"/>
  <path d="M 460,450 L 580,450 L 600,560 L 440,560 Z" fill="#A9A6A0" stroke="#191B1F" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 468,452 Q 520,350 572,452" fill="none" stroke="#5A5D64" stroke-width="9" stroke-linecap="round"/>
  <circle cx="520" cy="430" r="22" fill="#CFCCC5" stroke="#191B1F" stroke-width="3"/>
  <rect x="395" y="558" width="250" height="16" rx="3" fill="#5A5D64" stroke="#191B1F" stroke-width="2.5"/>
  <rect x="395" y="538" width="10" height="36" rx="2" fill="#5A5D64" stroke="#191B1F" stroke-width="2"/>
  <rect x="635" y="538" width="10" height="36" rx="2" fill="#5A5D64" stroke="#191B1F" stroke-width="2"/>
  <g transform="rotate(14 290 490)">
    <rect x="255" y="405" width="70" height="170" rx="14" fill="#8F9299" stroke="#191B1F" stroke-width="3.5"/>
    <rect x="272" y="435" width="36" height="110" rx="6" fill="#CFCCC5" stroke="#191B1F" stroke-width="2"/>
  </g>
  <g transform="rotate(-14 750 490)">
    <rect x="715" y="405" width="70" height="170" rx="14" fill="#8F9299" stroke="#191B1F" stroke-width="3.5"/>
    <rect x="732" y="435" width="36" height="110" rx="6" fill="#CFCCC5" stroke="#191B1F" stroke-width="2"/>
  </g>
  <line x1="290" y1="330" x2="290" y2="596" stroke="#191B1F" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round"/>
  <line x1="328.7" y1="334.8" x2="265.8" y2="587.0" stroke="#191B1F" stroke-width="2.5"/>
  <line x1="750" y1="330" x2="750" y2="596" stroke="#191B1F" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round"/>
  <line x1="711.3" y1="334.8" x2="774.2" y2="587.0" stroke="#191B1F" stroke-width="2.5"/>
  <path d="M 750,350 A 140 140 0 0 0 716.1,354.2" fill="none" stroke="#D4342A" stroke-width="5" stroke-linecap="round"/>
  <line x1="700" y1="296" x2="732.9" y2="351.0" stroke="#F6F5F2" stroke-width="7" stroke-linecap="round"/>
  <line x1="700" y1="296" x2="732.9" y2="351.0" stroke="#191B1F" stroke-width="2.5"/>
  <circle cx="732.9" cy="351.0" r="4.5" fill="#191B1F" stroke="#F6F5F2" stroke-width="1.5"/>
  <text x="690" y="286" text-anchor="end" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="26" font-weight="700" fill="#D4342A">キャンバー角</text>
  <text x="690" y="314" text-anchor="end" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="17" font-weight="400" fill="#5A5D64">垂直の点線と、中心線のあいだの角度</text>
  <line x1="321.51447126315946" y1="312" x2="319.5" y2="373.6" stroke="#F6F5F2" stroke-width="7" stroke-linecap="round"/>
  <line x1="321.51447126315946" y1="312" x2="319.5" y2="373.6" stroke="#191B1F" stroke-width="2.5"/>
  <circle cx="319.5" cy="373.6" r="4.5" fill="#191B1F" stroke="#F6F5F2" stroke-width="1.5"/>
  <text x="319.51447126315946" y="296" text-anchor="middle" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#191B1F">タイヤの中心線</text>
  <line x1="900" y1="392" x2="749.6" y2="430.3" stroke="#F6F5F2" stroke-width="7" stroke-linecap="round"/>
  <line x1="900" y1="392" x2="749.6" y2="430.3" stroke="#191B1F" stroke-width="2.5"/>
  <circle cx="749.6" cy="430.3" r="4.5" fill="#191B1F" stroke="#F6F5F2" stroke-width="1.5"/>
  <text x="910" y="396" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="700" fill="#191B1F">上側が内向き</text>
  <text x="910" y="424" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="18" font-weight="400" fill="#5A5D64">タイヤの上が車体の中心側へ傾く（ハの字）</text>
  <line x1="900" y1="534" x2="750.0" y2="534.0" stroke="#F6F5F2" stroke-width="7" stroke-linecap="round"/>
  <line x1="900" y1="534" x2="750.0" y2="534.0" stroke="#191B1F" stroke-width="2.5"/>
  <circle cx="750.0" cy="534.0" r="4.5" fill="#191B1F" stroke="#F6F5F2" stroke-width="1.5"/>
  <text x="910" y="538" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="700" fill="#191B1F">垂直の点線</text>
  <text x="910" y="566" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="18" font-weight="400" fill="#5A5D64">地面に対して直角（まっすぐ上）</text>
  <text x="150" y="618" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#5A5D64">路面</text>
  <text x="88" y="708" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="400" fill="#5A5D64">F1のことば、あいうえお ／ 第7回「き」　キャンバー</text>
  <text x="1512" y="708" text-anchor="end" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="15" font-weight="400" fill="#5A5D64">※ 傾きは大きく描いています。実際はもっとわずかです。架空の簡略図です。</text>
</svg>
