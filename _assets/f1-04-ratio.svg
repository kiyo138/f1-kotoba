<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="1600" height="650" role="img" aria-labelledby="ttl desc">
  <title id="ttl">力の内訳が、大きく変わった</title>
  <desc id="desc">2025年までと2026年の力の内訳を帯グラフで比較した図。2025年まではエンジン約80%・電気約20%、2026年は約50%・約50%と、電気の占める割合が大きく増えている。あわせてMGU-Kの出力が約120kWから約350kWへ、MGU-Hはありから廃止へと変わったことを添えている。</desc>

  <!--
    ============================================================
    週刊F1用語コラム「F1のことば、あいうえお」第4回 解説図2（ratio）
    「力の内訳が、大きく変わった」 1600 x 650

    ■ この図の主張
      2025年までと2026年、2本の帯グラフを並べ、
      エンジン（黒）と電気（赤）の占める幅の違いをひと目で見せる。
      数値はすべて出典Aに基づき、指示どおり「約」を付けて表記する。

    ■ 帯の内訳（帯の幅 = 1200px を100%とする）
      2025年まで：エンジン 960px(80%) ／ 電気 240px(20%)
      2026年　　：エンジン 600px(50%) ／ 電気 600px(50%)

    ■ 色の役割分担
      #191B1F インク … エンジン（黒い帯）
      #D4342A 赤     … 電気（強調。増えたほうを目立たせる）
      #5A5D64 グレー … 補助文字（付記）
      #F6F5F2 背景

    ■ 横方向の検算（帯の中の文字が帯からはみ出さないための概算。和字=1em）
      2025年帯・エンジン文字「エンジン　約80％」9字×24=216px（帯幅960pxに収まる）
      2025年帯・電気文字　　「電気　約20％」7字×22=154px（帯幅240pxに収まる）
      2026年帯・エンジン文字「エンジン　約50％」9字×24=216px（帯幅600pxに収まる）
      2026年帯・電気文字　　「電気　約50％」7字×24=168px（帯幅600pxに収まる）

    ■ 縦方向の検算（付記と次の行がぶつからないための計算）
      帯1 y260–330 → 付記1 baseline 364（帯下端との余白34px）
      見出し2026年 baseline 430（付記1下端364との余白66px）
      帯2 y440–510 → 付記2 baseline 544（帯下端との余白34px）
      フッタ baseline 600（付記2下端544との余白56px）

    ■ フォント：<text> 要素ごとに font-family 属性を直接書く（CSS継承に頼らない）
    ■ 影・ぼかしフィルタは使わない
    ============================================================
  -->

  <!-- ============ 背景 ============ -->
  <rect x="0" y="0" width="1600" height="650" fill="#F6F5F2"/>

  <!-- ============ 見出し ============ -->
  <text x="88" y="88" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="42" font-weight="700" fill="#191B1F">力の内訳が、大きく変わった</text>
  <line x1="88" y1="118" x2="248" y2="118" stroke="#D4342A" stroke-width="5"/>
  <text x="88" y="158" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="400" fill="#5A5D64">2025年までと2026年で、エンジンと電気の割合を比べます。</text>

  <!-- ============ 凡例（エンジン／電気） ============ -->
  <rect x="1300" y="140" width="18" height="18" fill="#191B1F"/>
  <text x="1326" y="155" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="400" fill="#191B1F">エンジン</text>
  <rect x="1420" y="140" width="18" height="18" fill="#D4342A"/>
  <text x="1446" y="155" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="400" fill="#191B1F">電気</text>

  <!-- ================================================================
       帯1：2025年まで（エンジン約80％・電気約20％）
       ================================================================ -->
  <text x="88" y="250" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="28" font-weight="700" fill="#191B1F">2025年まで</text>

  <rect x="300" y="260" width="960" height="70" fill="#191B1F"/>
  <rect x="1260" y="260" width="240" height="70" fill="#D4342A"/>
  <text x="780" y="303" text-anchor="middle" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">エンジン　約80％</text>
  <text x="1380" y="303" text-anchor="middle" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">電気　約20％</text>

  <text x="300" y="364" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="400" fill="#5A5D64">MGU-K出力　約120kW　／　MGU-H　あり</text>

  <!-- ================================================================
       帯2：2026年（エンジン約50％・電気約50％）
       ================================================================ -->
  <text x="88" y="430" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="28" font-weight="700" fill="#D4342A">2026年</text>

  <rect x="300" y="440" width="600" height="70" fill="#191B1F"/>
  <rect x="900" y="440" width="600" height="70" fill="#D4342A"/>
  <text x="600" y="483" text-anchor="middle" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">エンジン　約50％</text>
  <text x="1200" y="483" text-anchor="middle" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">電気　約50％</text>

  <text x="300" y="544" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="400" fill="#5A5D64">MGU-K出力　約350kW（約3倍）　／　MGU-H　廃止</text>

  <!-- ============ フッタ ============ -->
  <text x="88" y="600" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="400" fill="#5A5D64">F1のことば、あいうえお ／ 第4回「え」　エネルギーマネージメント</text>
</svg>
