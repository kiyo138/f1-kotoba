<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740" width="1600" height="740" role="img" aria-labelledby="ttl desc">
  <title id="ttl">早めのクリップと遅めのクリップ</title>
  <desc id="desc">同じ形の架空の右コーナーを2つ並べた比較図。左は早めに内側へ寄る線で、出口でも曲がり続ける。右は遅めに内側へ寄る線で、出口で早くまっすぐ向く。</desc>
  <!-- 影・filter 不使用。架空・無地の汎用コーナー（実在コースに似せない）。 -->
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D4342A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="740" fill="#F6F5F2"/>
  <text x="88" y="88" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="42" font-weight="700" fill="#191B1F" >内側に寄る点が手前か、奥か</text>
  <line x1="88" y1="118" x2="248" y2="118" stroke="#D4342A" stroke-width="5"/>
  <text x="88" y="158" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="400" fill="#5A5D64" >同じコーナーに、内側へ寄る点だけを変えた線を引いて比べます。</text>
  <rect x="88" y="190" width="692" height="470" rx="6" fill="#FFFFFF" stroke="#A9A6A0" stroke-width="2"/>
  <text x="112" y="230" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="28" font-weight="700" fill="#191B1F" >早め（手前）でクリップ</text>
  <text x="112" y="258" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="400" fill="#5A5D64" >入口は速く入れるが、出口の速度が上がりにくい</text>
  <g transform="translate(88,190)">
  <path d="M 20,150 H 250 A 130 130 0 0 1 380,280 V 450" fill="none" stroke="#8F9299" stroke-width="116"/>
  <path d="M 20,150 H 250 A 130 130 0 0 1 380,280 V 450" fill="none" stroke="#E6E3DC" stroke-width="110"/>
  <path d="M 250,200 A 80 80 0 0 1 330,280" fill="none" stroke="#D4342A" stroke-width="10"/>
  <path d="M 250,200 A 80 80 0 0 1 330,280" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-dasharray="12 12"/>
  <path d="M 20,112 C 170,112 203,168 285,206 C 367,244 428,330 425,450" fill="none" stroke="#F6F5F2" stroke-width="9" stroke-linecap="round"/>
  <path d="M 20,112 C 170,112 203,168 285,206 C 367,244 428,330 425,450" fill="none" stroke="#D4342A" stroke-width="4.5" marker-end="url(#arrowRed)"/>
  <circle cx="285" cy="206" r="9" fill="#FFFFFF" stroke="#D4342A" stroke-width="4"/>
  </g>
  <text x="550" y="490" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#191B1F" >出口でもまだ</text>
  <text x="550" y="522" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#191B1F" >曲がっていて</text>
  <text x="550" y="554" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#D4342A" >直線へ向くのが遅い</text>
  <text x="550" y="360" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#191B1F" >クリッピング</text>
  <text x="550" y="386" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#191B1F" >ポイント</text>
  <line x1="542" y1="354" x2="384" y2="393" stroke="#F6F5F2" stroke-width="7" stroke-linecap="round"/>
  <line x1="542" y1="354" x2="384" y2="393" stroke="#191B1F" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="820" y="190" width="692" height="470" rx="6" fill="#FFFFFF" stroke="#A9A6A0" stroke-width="2"/>
  <text x="844" y="230" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="28" font-weight="700" fill="#191B1F" >遅め（奥）でクリップ</text>
  <text x="844" y="258" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="400" fill="#5A5D64" >出口で曲がる半径が大きい</text>
  <g transform="translate(820,190)">
  <path d="M 20,150 H 250 A 130 130 0 0 1 380,280 V 450" fill="none" stroke="#8F9299" stroke-width="116"/>
  <path d="M 20,150 H 250 A 130 130 0 0 1 380,280 V 450" fill="none" stroke="#E6E3DC" stroke-width="110"/>
  <path d="M 250,200 A 80 80 0 0 1 330,280" fill="none" stroke="#D4342A" stroke-width="10"/>
  <path d="M 250,200 A 80 80 0 0 1 330,280" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-dasharray="12 12"/>
  <path d="M 20,112 C 230,112 282,154 324,245 C 362,327 385,380 385,450" fill="none" stroke="#F6F5F2" stroke-width="9" stroke-linecap="round"/>
  <path d="M 20,112 C 230,112 282,154 324,245 C 362,327 385,380 385,450" fill="none" stroke="#D4342A" stroke-width="4.5" marker-end="url(#arrowRed)"/>
  <circle cx="324" cy="245" r="9" fill="#FFFFFF" stroke="#D4342A" stroke-width="4"/>
  </g>
  <text x="1282" y="490" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#191B1F" >出口で早く</text>
  <text x="1282" y="522" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#191B1F" >まっすぐ向き</text>
  <text x="1282" y="554" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#D4342A" >加速を始めやすい</text>
  <text x="1282" y="360" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#191B1F" >クリッピング</text>
  <text x="1282" y="386" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#191B1F" >ポイント</text>
  <line x1="1274" y1="354" x2="1155" y2="432" stroke="#F6F5F2" stroke-width="7" stroke-linecap="round"/>
  <line x1="1274" y1="354" x2="1155" y2="432" stroke="#191B1F" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="708" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="400" fill="#5A5D64" >F1のことば、あいうえお ／ 第9回「く」　クリッピングポイント</text>
  <text x="1512" y="708" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="15" font-weight="400" fill="#5A5D64" text-anchor="end">※ 架空の模式図です。道幅や曲がり方は単純にしてあります。</text>
</svg>
