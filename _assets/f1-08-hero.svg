<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl desc">
  <title id="ttl">F1のことば、あいうえお 第8回「く クラッシャブルストラクチャー」</title>
  <desc id="desc">レンガのような赤茶（テラコッタ）の背景に、クリーム色を差し色にした赤茶のフォーミュラカーのシルエット。ホイールはクリーム色。左上に連載タイトル、その下に大きく「く クラッシャブルストラクチャー」。</desc>

  <!--
    週刊F1用語コラム「F1のことば、あいうえお」ヒーロー画像 原本
    第8回 「く」＝クラッシャブルストラクチャー  画寸 1600 x 900
    第7回の原本を複製。座標・造形は変えず、文字と色だけ差し替え。
    配色名      テラコッタ（くすんだレンガ色の赤茶） × クリーム
    アクセント  #EED3A0（濃淡 #F8E6C2 #C9A86C #FFF5E0）
    インク      #FFFFFF
    背景        #7A3626 → #5E281C → #33150E（色相およそ11度、彩度は中程度。
                エスプレッソ #3A2B23 より明るく赤く、バーガンディ #4A1628 の340度より黄み寄り）
    車体        #B8644C #8C4433 #C26E55 #964B37 #A85A44 #5A2619 #3E1A11 #1F0C07 #120705
    タイヤ      #2E2523 #211A18 #776560 #160F0D
    ヘルメット  #FBF7F0
    各<text>に font-family を直書き。影は radialGradient。架空ライバリー。

    text#word は14字のため font-size 95→82、letter-spacing 5.7→4.92（0.06em×82px）。x/y は第7回のまま。
      右端の見積もり  295 ＋ 82×14 ＋ 4.92×13 ＝ 295 ＋ 1148 ＋ 63.96 ＝ 1506.96 ≦ 1520
      縦の余裕        ベースライン y=310、字の下端はおよそ 310＋82×0.12 ≒ 320。
                      横罫 y=355、車体の最上端はリアウイング上端 y=482（ボディ上端は y=532）。
                      字の下端 320 と車体上端 482 のあいだに 162 の間隔があり、重ならない。
  -->

  <defs>
    <!-- 背景：上が明るく下がわずかに沈む縦グラデーション -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#7A3626"/>
      <stop offset="0.55" stop-color="#5E281C"/>
      <stop offset="1"    stop-color="#33150E"/>
    </linearGradient>

    <!-- 車体：テラコッタ（背景より明るい赤茶。タイヤと溶けないよう一段持ち上げてある） -->
    <linearGradient id="bodyGrad" x1="0" y1="520" x2="0" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8644C"/>
      <stop offset="1" stop-color="#8C4433"/>
    </linearGradient>
    <linearGradient id="sidepodGrad" x1="0" y1="630" x2="0" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C26E55"/>
      <stop offset="1" stop-color="#964B37"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="470" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A85A44"/>
      <stop offset="1" stop-color="#8C4433"/>
    </linearGradient>

    <!-- タイヤ：車体・背景より暗く彩度を落とした茶黒（肩のハイライトで背景から輪郭を立てる） -->
    <linearGradient id="tyreGrad" x1="0" y1="-88" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E2523"/>
      <stop offset="1" stop-color="#211A18"/>
    </linearGradient>
    <!-- ホイール円板：アクセント（クリーム） -->
    <linearGradient id="rimGrad" x1="-38" y1="-38" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#F8E6C2"/>
      <stop offset="0.5" stop-color="#EED3A0"/>
      <stop offset="1"   stop-color="#C9A86C"/>
    </linearGradient>

    <!-- 接地影：ぼかしの代わりに放射グラデーションで作る（フィルタ非依存） -->
    <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#000000" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="helmetClip">
      <circle cx="744" cy="582" r="25"/>
    </clipPath>

    <!-- タイヤ＋ホイール（原点中心・外径88）。前後で use して使い回す -->
    <g id="wheel">
      <circle r="88" fill="url(#tyreGrad)"/>
      <!-- 上面〜左肩のハイライト（第1回・第2回にある明るい円弧） -->
      <path d="M -73.4,-15.6 A 75 75 0 0 1 23.2,-71.3"
            fill="none" stroke="#776560" stroke-width="24" opacity="0.85"/>
      <circle r="57" fill="#160F0D"/>
      <circle r="53" fill="url(#rimGrad)"/>
      <path d="M 0,-53 A 53 53 0 0 1 37.5,-37.5 L 0,0 Z" fill="#FFF5E0" opacity="0.45"/>
      <circle r="13" fill="#1F0C07"/>
      <path d="M -2,-7 L -27,15 L 4,6 Z" fill="#1F0C07"/>
    </g>
  </defs>

  <!-- ============ 背景 ============ -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- ============ 見出し ============ -->
  <!-- letter-spacing は em を px に換算して絶対値で書く（0.30em×30px=9 / 0.04em×26px=1.04 / 0.06em×82px=4.92） -->
  <text x="107" y="115" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="30" font-weight="400" letter-spacing="9" fill="#EED3A0">Ｆ１のことば、あいうえお</text>
  <text id="seriesNo" x="110" y="175" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="26" font-weight="400" letter-spacing="1.04" fill="#FFFFFF" fill-opacity="0.88">第8回</text>
  <text id="kana" x="115" y="310" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="150" font-weight="700" fill="#EED3A0">く</text>
  <text id="word" x="295" y="310" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="82" font-weight="700" letter-spacing="4.92" fill="#FFFFFF">クラッシャブルストラクチャー</text>

  <!-- 見出しと図版を分ける横罫 -->
  <line x1="105" y1="355" x2="1100" y2="355" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- 左端の速度線 -->
  <line x1="10" y1="432" x2="335" y2="432" stroke="#EED3A0" stroke-opacity="0.28" stroke-width="2.5"/>
  <line x1="0"  y1="518" x2="305" y2="518" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="2.5"/>

  <!-- ============ 車両 ============ -->
  <g id="car">

    <!-- 接地影 -->
    <ellipse cx="770" cy="792" rx="700" ry="26" fill="url(#shadowGrad)"/>

    <!-- リアウイング（上下2枚＋2本の支柱＋エンドプレート） -->
    <g id="rearWing">
      <rect x="1236" y="484" width="214" height="21" rx="3" fill="url(#wingGrad)"/>
      <rect x="1236" y="484" width="214" height="6"  rx="2" fill="#EED3A0"/>
      <rect x="1300" y="503" width="15"  height="92" fill="#5A2619"/>
      <rect x="1372" y="503" width="15"  height="92" fill="#5A2619"/>
      <rect x="1288" y="600" width="16"  height="62" fill="#5A2619"/>
      <rect x="1292" y="592" width="130" height="20" rx="3" fill="url(#wingGrad)"/>
      <rect x="1418" y="482" width="32"  height="142" rx="3" fill="url(#wingGrad)"/>
    </g>

    <!-- フロントウイング（多段の板＋アクセント色のライン） -->
    <g id="frontWing">
      <rect x="44"  y="706" width="15"  height="70" rx="2" fill="#5A2619"/>
      <path d="M 59,716 L 240,716 L 240,731 L 59,735 Z" fill="url(#bodyGrad)"/>
      <path d="M 59,742 L 284,742 L 284,758 L 59,762 Z" fill="url(#bodyGrad)"/>
      <rect x="63"  y="760" width="214" height="10" rx="2" fill="#EED3A0"/>
      <rect x="18"  y="772" width="272" height="6"  rx="2" fill="#8C4433" opacity="0.85"/>
    </g>

    <!-- 車体本体：ノーズ〜モノコック〜エンジンカバー〜リアエンド -->
    <path id="bodyShell"
          d="M 178,714
             L 466,648
             L 636,600
             L 664,590
             C 676,568 708,557 748,556
             L 806,552
             L 816,536
             L 912,532
             L 924,566
             L 1010,588
             L 1120,618
             L 1210,640
             L 1300,658
             L 1300,722
             L 500,722
             L 178,742 Z"
          fill="url(#bodyGrad)"/>

    <!-- サイドポッド -->
    <path d="M 800,650 C 858,634 1004,642 1122,660 L 1162,702 L 1162,722 L 800,722 Z"
          fill="url(#sidepodGrad)"/>
    <!-- サイドポッド前端の稜線 -->
    <line x1="822" y1="650" x2="822" y2="712" stroke="#120705" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round"/>

    <!-- フロア（車体下端に密着させる。隙間を作らない） -->
    <rect x="500" y="720" width="800" height="24" fill="#3E1A11"/>
    <!-- フロア際のアクセントライン -->
    <rect x="505" y="722" width="600" height="8" rx="2" fill="#EED3A0" opacity="0.85"/>
    <!-- サイドポッドからノーズへ走るアクセント色のライン -->
    <path d="M 1110,632 C 950,648 800,657 640,677 C 470,699 300,721 176,737"
          fill="none" stroke="#EED3A0" stroke-width="7" stroke-linecap="round"/>

    <!-- コクピット開口 -->
    <ellipse cx="745" cy="598" rx="62" ry="17" fill="#120705"/>

    <!-- ヘイロー（頭上の輪郭線） -->
    <path d="M 660,628 C 655,588 690,557 748,553 C 812,549 862,563 884,585"
          fill="none" stroke="#1F0C07" stroke-width="9" stroke-linecap="round"/>
    <path d="M 884,585 L 896,608"
          fill="none" stroke="#1F0C07" stroke-width="9" stroke-linecap="round"/>

    <!-- ヘルメット（やわらかい白＋アクセント色のバイザー帯）
         地は #FBF7F0。クリームのバイザー帯と見分けがつくよう、差し色より白に近い温かみのある白を使っている。 -->
    <g id="helmet">
      <circle cx="744" cy="582" r="25" fill="#FBF7F0"/>
      <g clip-path="url(#helmetClip)">
        <rect x="717" y="555" width="54" height="23" fill="#EED3A0"/>
        <rect x="717" y="578" width="54" height="9"  fill="#1F0C07"/>
      </g>
    </g>

    <!-- 前後タイヤ -->
    <use href="#wheel" xlink:href="#wheel" transform="translate(412,656)"/>
    <use href="#wheel" xlink:href="#wheel" transform="translate(1206,656) scale(1.022)"/>
  </g>
</svg>
